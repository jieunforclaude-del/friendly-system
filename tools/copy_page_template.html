<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블로그 복붙함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* 레이아웃: 위에 탭, 가운데 블로그 본문 미리보기(복사 대상), 옆/위에 제목·태그 복사 카드 */
:root {
  --bg: #f6f5f0;
  --paper: #ffffff;
  --ink: #23231f;
  --muted: #6d6b62;
  --line: #e2e0d6;
  --accent: #b8860b;
  --accent-soft: #fbf3dc;
  --photo: #e9f1fb;
  --photo-ink: #2b5b8f;
  --fill: #fdecec;
  --fill-ink: #a2382f;
  --font-display: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181814; --paper: #22221d; --ink: #ecebe4; --muted: #a8a698; --line: #3a3931;
    --accent: #e0b44a; --accent-soft: #3a321c; --photo: #1f2d3d; --photo-ink: #9cc3ec;
    --fill: #3d2421; --fill-ink: #f0a59c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181814; --paper: #22221d; --ink: #ecebe4; --muted: #a8a698; --line: #3a3931;
  --accent: #e0b44a; --accent-soft: #3a321c; --photo: #1f2d3d; --photo-ink: #9cc3ec;
  --fill: #3d2421; --fill-ink: #f0a59c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.75; font-size: 16px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 20px; }
header h1 { font-family: var(--font-display); font-weight: 900; font-size: 1.6rem; margin: 0; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { font: inherit; font-weight: 700; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tab:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .side { order: -1; } }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
.card h2 { font-size: .95rem; margin: 0; font-weight: 700; }
.side { display: grid; gap: 16px; position: sticky; top: 16px; }
@media (max-width: 860px) { .side { position: static; } }
.title-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; padding: 10px; border-radius: 8px; background: var(--bg); font-size: .9rem; line-height: 1.5; }
.title-row.best { background: var(--accent-soft); }
.title-row small { display: block; color: var(--accent); font-weight: 700; font-size: .75rem; }
.tip { font-size: .82rem; color: var(--muted); margin: 0; }
.btn { font: inherit; font-weight: 700; font-size: .85rem; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 1rem; padding: 12px 18px; width: 100%; }
.btn.done { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.notes { font-size: .82rem; color: var(--muted); white-space: pre-line; margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; font-size: .78rem; }
.paper { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.paper-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); font-size: .85rem; color: var(--muted); flex-wrap: wrap; }
.post { padding: 28px 32px 40px; max-width: 720px; margin: 0 auto; }
@media (max-width: 500px) { .post { padding: 20px 16px 32px; } }
.post h3 { font-size: 1.3rem; font-weight: 900; margin: 2em 0 .6em; text-wrap: balance; }
.post h4 { font-size: 1.1rem; font-weight: 700; margin: 1.6em 0 .4em; }
.post h2 { font-size: 1.4rem; font-weight: 900; margin: 2em 0 .6em; padding-bottom: .3em; border-bottom: 2px solid var(--ink); }
.post p { margin: .8em 0; }
.post hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.post ul { padding-left: 1.2em; }
.post .tbl { overflow-x: auto; margin: 1em 0; }
.post table { border-collapse: collapse; width: 100%; font-size: .93rem; font-variant-numeric: tabular-nums; }
.post th, .post td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.post th { background: var(--bg); font-weight: 700; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 6px; font-size: .88rem; font-weight: 700; line-height: 1.6; }
.chip.photo { background: var(--photo); color: var(--photo-ink); }
.chip.fill { background: var(--fill); color: var(--fill-ink); }
.chip.link { background: var(--accent-soft); color: var(--accent); }
.post p.solo { margin: .5em 0; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>블로그 복붙함</h1>
    <p>본문 전체 복사 → 네이버 블로그 에디터에 붙여넣기. 굵은 글씨·표가 그대로 들어가요. 색깔 칩은 사진 넣을 자리 / 직접 채울 자리예요.</p>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="layout">
    <section class="paper">
      <div class="paper-head">
        <span id="count">본문</span>
        <div class="legend">
          <span class="chip photo">사진 자리</span>
          <span class="chip fill">직접 입력</span>
          <span class="chip link">링크 자리</span>
        </div>
      </div>
      <article class="post" id="post"></article>
    </section>
    <aside class="side">
      <div class="card">
        <button class="btn primary" id="copyAll" type="button">본문 전체 복사</button>
        <p class="tip">붙여넣은 뒤 색깔 칩 자리에 사진을 넣고 칩 글자는 지워주세요.</p>
      </div>
      <div class="card">
        <h2>제목 후보</h2>
        <div id="titles" style="display:grid;gap:8px"></div>
        <p class="tip" id="tip"></p>
      </div>
      <div class="card">
        <h2>해시태그</h2>
        <div class="title-row"><span id="tags"></span><button class="btn" type="button" id="copyTags">복사</button></div>
      </div>
      <div class="card">
        <h2>메모</h2>
        <p class="notes" id="notes"></p>
      </div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const POSTS = /*__POSTS__*/[];
const $ = id => document.getElementById(id);

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800);
}

// 자리표시 [사진: ...] 등을 칩으로
function chipify(html) {
  return html.replace(/\[(사진[^\]]*|지도[^\]]*|이미지[^\]]*|영상[^\]]*)\]/g, '<span class="chip photo">📷 [$1]</span>')
             .replace(/\[(직접 입력[^\]]*)\]/g, '<span class="chip fill">✏️ [$1]</span>')
             .replace(/\[(링크[^\]]*)\]/g, '<span class="chip link">🔗 [$1]</span>');
}

function splitTags(body) {
  const lines = body.trim().split("\n");
  const last = lines[lines.length - 1].trim();
  if (last.startsWith("#")) return { body: lines.slice(0, -1).join("\n"), tags: last };
  return { body, tags: "" };
}

async function copyRich(el, plain) {
  const html = el.innerHTML;
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([html], { type: "text/html" }),
        "text/plain": new Blob([plain], { type: "text/plain" })
      })]);
      return true;
    }
  } catch (e) {}
  // 대체: 화면 선택 후 복사
  try {
    const r = document.createRange(); r.selectNodeContents(el);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    const ok = document.execCommand("copy"); s.removeAllRanges(); return ok;
  } catch (e) { return false; }
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch (e) { return false; }
}

function flash(btn, ok) {
  const label = btn.dataset.label || btn.textContent; btn.dataset.label = label;
  btn.textContent = ok ? "복사됨 ✓" : "복사 실패"; btn.classList.toggle("done", ok);
  toast(ok ? "복사했어요! 블로그에 붙여넣으세요" : "복사가 막혔어요. 본문을 드래그해서 복사해 주세요");
  setTimeout(() => { btn.textContent = label; btn.classList.remove("done"); }, 1600);
}

function render(i) {
  const p = POSTS[i];
  document.querySelectorAll(".tab").forEach((t, j) => t.setAttribute("aria-selected", String(j === i)));
  const { body, tags } = splitTags(p.body);
  let html = marked.parse(body, { gfm: true, breaks: true });
  html = chipify(html).replace(/<table>/g, '<div class="tbl"><table>').replace(/<\/table>/g, "</table></div>");
  $("post").innerHTML = html;
  $("count").textContent = "공백 제외 약 " + $("post").innerText.replace(/\s/g, "").length.toLocaleString() + "자";
  $("tags").textContent = tags || "(없음)";
  const plain = t => t.replace(/\*\*|`/g, "");
  $("notes").textContent = plain(p.notes);
  $("tip").textContent = plain(p.tip.replace(/^\d번 추천:\s*/, ""));
  const box = $("titles"); box.innerHTML = "";
  p.titles.forEach((t, k) => {
    const row = document.createElement("div"); row.className = "title-row" + (k === 0 ? " best" : "");
    const span = document.createElement("span");
    span.innerHTML = (k === 0 ? "<small>추천</small>" : "") ; span.append(t);
    const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = "복사";
    b.onclick = async () => flash(b, await copyText(t));
    row.append(span, b); box.append(row);
  });
  try { localStorage.setItem("copyTab", String(i)); } catch (e) {}
}

POSTS.forEach((p, i) => {
  const b = document.createElement("button"); b.className = "tab"; b.type = "button"; b.role = "tab";
  b.textContent = p.tab; b.onclick = () => render(i); $("tabs").append(b);
});
$("copyAll").onclick = async e => flash(e.currentTarget, await copyRich($("post"), $("post").innerText));
$("copyTags").onclick = async e => flash(e.currentTarget, await copyText($("tags").textContent));
let start = 0; try { start = Math.min(+localStorage.getItem("copyTab") || 0, POSTS.length - 1); } catch (e) {}
render(start);
</script>
</body>
</html>
